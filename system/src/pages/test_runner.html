<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <title>Defense in Depth Unit Tests</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a2e; color: #f0f0f4; }
    .pass { color: #4ade80; }
    .fail { color: #ef4444; }
    .summary { margin-top: 20px; padding: 15px; background: #16161f; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Defense in Depth — Unit Tests</h1>
  <p>Open browser console (F12) to see detailed output.</p>
  <button id="runTests" style="padding: 10px 20px; font-size: 16px; background: #6c8eff; color: white; border: none; border-radius: 4px; cursor: pointer;">Run Tests</button>
  <div id="results"></div>
  <script src="network_defense_test.js"></script>
  <script>
    document.getElementById('runTests').addEventListener('click', function() {
      // Tests run automatically on load, but we can re-run by reloading
      location.reload();
    });
  </script>
</body>
</html>
